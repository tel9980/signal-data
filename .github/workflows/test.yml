name: test

# 只在这几个文件变化时跑，避免每天的数据滚动提交反复触发（out/** 不在 paths 里）
on:
  push:
    branches: [main]
    paths:
      - 'pipeline.py'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 不需要装 eltdx：pipeline 只在 main() 里 import 它，测试全部离线
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests
