name: test

# 代码变化时跑测试；out/** 变化时也跑（只跑数据完整性自检，防止误删/退回旧数据）
on:
  push:
    branches: [main]
    paths:
      - 'pipeline.py'
      - 'tests/**'
      - 'scripts/**'
      - 'out/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 不需要装 eltdx：pipeline 只在 main() 里 import 它，测试全部离线
      - run: python -m pip install -q pytest
      - name: 数据完整性自检（防止 out/ 被误删/退回旧版）
        run: python3 scripts/check_data_integrity.py

      - run: python -m pytest -q tests
