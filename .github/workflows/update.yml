name: Update Market Data

on:
  schedule:
    # 交易日两班：北京时间 11:35（午间）与 15:35（收盘后）
    # GitHub 的 cron 用 UTC：03:35 / 07:35
    - cron: "35 3 * * 1-5"
    - cron: "35 7 * * 1-5"
  workflow_dispatch:        # 也可在 Actions 页面手动点 Run workflow

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 滚动提交需要完整的父提交信息

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eltdx
        run: python -m pip install -q -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit (rolling)
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add -A out

          if git diff --cached --quiet; then
            echo "输出无变化，跳过提交"
            exit 0
          fi

          MSG="chore: 行情数据更新 $(date -u +%FT%TZ)"
          LAST=$(git log -1 --pretty=%s)
          if [ "${LAST#chore: 行情数据更新}" != "$LAST" ]; then
            git commit -q --amend -m "$MSG"     # 上一次就是滚动提交 → 原地覆盖，历史不增长
          else
            git commit -q -m "$MSG"
          fi

          git push --force origin HEAD:main
