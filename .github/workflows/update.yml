name: Update Market Data

on:
  schedule:
    # 北京时间 11:35（午间）、15:35（收盘后）、18:05（补跑：前面漏了才跑）
    # GitHub 的 cron 用 UTC：03:35 / 07:35 / 10:05
    - cron: "35 3 * * 1-5"
    - cron: "35 7 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:        # 也可在 Actions 页面手动点 Run workflow

permissions:
  contents: write
  actions: read             # guard 要读历史 run

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  # 去重 + 补跑：90 分钟内刚成功过就整轮跳过（GitHub cron 会延迟/重复触发）
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: update.yml
        run: |
          if python3 scripts/should_run.py; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  # 五个分片并行：sz 主板 / sz 创业板 / sh 主板 / sh 科创 / 北交所
  # 单片 1100-1700 只，墙钟时间从「最慢的一个市场」降到「最慢的一个板块」
  shard:
    needs: guard
    if: needs.guard.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: sz
            prefix: "000,001,002,003"
          - market: sz
            prefix: "300,301"
          - market: sh
            prefix: "600,601,603,605"
          - market: sh
            prefix: "688,689"
          - market: bj
            prefix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -q -r requirements.txt
      - name: 抓取 ${{ matrix.market }} ${{ matrix.prefix }}
        env:
          # 五个分片同时对同一个通达信节点，单个 shard 的并发要压下来，
          # 否则容易把命令通道挤断（ConnectionClosedError: runtime command channel is closed）
          QUOTE_WORKERS: "7"
          DERIVE_WORKERS: "5"
          POOL_SIZE: "10"
          SERVER_COUNT: "2"
        run: |
          python pipeline.py --markets "${{ matrix.market }}" --prefix "${{ matrix.prefix }}" \
                             --shard --out-dir shard
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.market }}-${{ strategy.job-index }}
          path: shard
          retention-days: 1

  # 合并 → 闸门 → 发布 → 滚动提交
  publish:
    needs: [guard, shard]
    # 分片全绿才发布；有失败就交给下面的 fallback 兜底。
    # 注意必须带 always()，否则依赖 job 失败时 GitHub 会直接 skip 掉这个 job。
    if: always() && needs.shard.result == 'success' && (needs.guard.outputs.go == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 滚动提交需要完整的父提交信息

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eltdx
        run: python -m pip install -q -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard
          merge-multiple: true

      - name: Merge + gate + publish
        run: python pipeline.py --merge shard --out-dir out

      - name: Commit (rolling)
        run: bash scripts/commit_data.sh

  # 兜底：任一分片失败（通达信抖动）就退回单机全量再跑一次，
  # 宁可慢 3 分钟，也不要整轮没有数据。
  fallback:
    needs: [guard, shard]
    if: always() && needs.shard.result == 'failure' && needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install eltdx
        run: python -m pip install -q -r requirements.txt

      - name: 单机全量兜底
        run: python pipeline.py --out-dir out

      - name: Commit (rolling)
        run: bash scripts/commit_data.sh
