name: Intraday Snapshot

# 盘中每 10 分钟只刷新「现价 + 指数」，force-push 到独立分支 intraday。
# 成本：约 70 个请求 / 35 秒 / 约 130 KB；main 分支和历史完全不受影响。
on:
  schedule:
    # GitHub cron 用 UTC，北京时间减 8 小时。
    # 覆盖 09:00-11:50 与 13:00-15:50，真正的过滤交给 scripts/trading_time.py
    - cron: "*/10 1-3 * * 1-5"
    - cron: "*/10 5-7 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "非交易时段也跑（只用于手动调试）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false       # 上一轮没跑完就排队，不并发轰炸通达信

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -q -r requirements.txt

      - name: 交易时段守卫
        id: guard
        continue-on-error: true        # 非交易时段跳过是正常行为，不该显示成红色失败
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "手动强制运行（inputs.force=true）"
            python3 scripts/trading_time.py --force
          else
            python3 scripts/trading_time.py
          fi

      - name: 抓快照（不含派生指标）
        if: steps.guard.outcome == 'success'
        env:
          QUOTE_WORKERS: "6"        # 盘中压着跑，避免挤断通达信命令通道
          POOL_SIZE: "8"
          SERVER_COUNT: "1"
        run: python pipeline.py --no-signals --out-dir intraday

      - name: 发布到 intraday 分支
        if: steps.guard.outcome == 'success'
        run: bash scripts/publish_intraday.sh
